[package]
name = "mai_finale_to_deluxe"
version = "2.0.0"
edition = "2021"

[profile.release]
# Automatically strip symbols from the binary.
strip = true
opt-level = "z"  # Optimize for size.
# Enable link-time optimization
lto = true

[features]
default = ["touch", "reader", "jvs", "gui"]
touch = []
reader = ["dep:jvs-packets"]
jvs = ["dep:jvs-packets"]
gui = ["dep:eframe"]

[dependencies]
clap = { version = "4.3.5", features = ["derive"] }
winapi = { version = "0.3.9", features = ["winuser", "timeapi", "minwindef", "wincon", "windef"] }
serde = { version = "1.0.158", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
anyhow = "1.0.79"
serial2 = { version = "0.2.17", features = ["windows"] }
ctrlc = "3.4.2"
jvs-packets = { version = "1.1.0", optional = true }
thiserror = "1.0.64"
serde_with = "3.16.1"
toml_edit = { version = "0.24.0", features = ["serde"] }
arrayvec = { version = "0.7.6", features = ["serde"] }
maifinale_macros = { path = "macros" }
eframe = { version = "0.33.3", optional = true, default-features = false, features = ["default_fonts", "glow"] }
cfg-if = "1.0.4"
