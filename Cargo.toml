[package]
name = "mai_finale_to_deluxe"
version = "2.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["touch", "reader", "jvs"]
touch = []
reader = []
jvs = []

[dependencies]
clap = { version = "4.3.5", features = ["derive"] }
toml = "0.8.9"
winapi = { version = "0.3.9", features = ["winuser", "timeapi", "minwindef"] }
serde = { version = "1.0.158", features = ["derive"] }
flexi_logger = "0.29.1"
log = "0.4.17"
anyhow = "1.0.79"
serial2 = { version = "0.2.17", features = ["windows"] }
ctrlc = "3.4.2"
jvs-packets = "1.1.0"
thiserror = "1.0.64"
serde_with = "3.16.1"
toml_edit = { version = "0.24.0", features = ["serde"] }
